[package]
name = "dlms-learning-lab"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
tempfile = "3"
png = "0.18"

[profile.release]
strip = true

# This producer is immutable actual-public9 evidence, not a current evaluator test.
[features]
historical-evaluator9-capture = []
historical-evaluator10-capture = []
historical-evaluator11-capture = []

[[example]]
name = "automation_before10_capture"
required-features = ["historical-evaluator9-capture"]

[[example]]
name = "parameters_before11_capture"
required-features = ["historical-evaluator10-capture"]

[[example]]
name = "scripting_before12_capture"
required-features = ["historical-evaluator11-capture"]
