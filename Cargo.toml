[package]
name = "dlms-learning-lab"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
tempfile = "3"
png = "0.18"

[profile.release]
strip = true

# Keep useful file/line backtraces without full type/variable debug data for
# this large simulation crate. Dependency and release settings stay unchanged.
[profile.dev.package.dlms-learning-lab]
debug = "line-tables-only"

[profile.test.package.dlms-learning-lab]
debug = "line-tables-only"

# This producer is immutable actual-public9 evidence, not a current evaluator test.
[features]
historical-evaluator9-capture = []
historical-evaluator10-capture = []
historical-evaluator11-capture = []
historical-evaluator12-capture = []
historical-evaluator13-capture = []
historical-evaluator14-capture = []
historical-evaluator15-capture = []
historical-evaluator16-capture = []
historical-evaluator17-capture = []
historical-evaluator18-capture = []

[[example]]
name = "automation_before10_capture"
required-features = ["historical-evaluator9-capture"]

[[example]]
name = "parameters_before11_capture"
required-features = ["historical-evaluator10-capture"]

[[example]]
name = "scripting_before12_capture"
required-features = ["historical-evaluator11-capture"]

[[example]]
name = "scripting_before13_capture"
required-features = ["historical-evaluator12-capture"]

# Fixed genuine13 evidence producer; unavailable to ordinary/default targets.
[[example]]
name = "scripting_before14_capture"
required-features = ["historical-evaluator13-capture"]

# Fixed genuine14 evidence producer; unavailable to ordinary/default targets.
[[example]]
name = "scripting_before15_capture"
required-features = ["historical-evaluator14-capture"]

# Fixed genuine15 evidence; no old evaluator selection.
[[example]]
name = "scripting_before16_capture"
required-features = ["historical-evaluator15-capture"]

# Fixed genuine16 evidence; no old evaluator selection.
[[example]]
name = "scripting_before17_capture"
required-features = ["historical-evaluator16-capture"]

# Fixed genuine17 evidence; never selects an older evaluator.
[[example]]
name = "scripting_before18_capture"
required-features = ["historical-evaluator17-capture"]

# Fixed genuine18 evidence; no old evaluator selection.
[[example]]
name = "scripting_before19_capture"
required-features = ["historical-evaluator18-capture"]

# Local reviewed prototype; preserves the Foundation 0.2 API.
[patch.crates-io]
objc2-foundation = { path = "vendor/objc2-foundation" }
